name: Deploy Server (Hugging Face & Oracle VM)

on:
  push:
    branches: [ main ]
    paths:
      - 'hf_server/**'

jobs:
  deploy_backup_hf:
    name: Sync to Hugging Face Space (Backup Server)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install huggingface_hub
        run: pip install huggingface_hub

      - name: Upload to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -c "
          import os, time
          from huggingface_hub import HfApi
          api = HfApi(token=os.environ['HF_TOKEN'])
          for i in range(5):
              try:
                  api.upload_folder(folder_path='./hf_server', repo_id='Gowthamr23/fast-api-cloud', repo_type='space', delete_patterns='*')
                  print('Upload completed successfully!')
                  break
              except Exception as e:
                  if hasattr(e, 'response') and e.response is not None and e.response.status_code == 429:
                      wait_time = (i + 1) * 30
                      print(f'Rate limited (429). Retrying in {wait_time}s... (Attempt {i+1}/5)')
                      time.sleep(wait_time)
                  else:
                      raise e
          "

      - name: Wait for Hugging Face Space Deployment
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -c "
          import os, time, sys
          from huggingface_hub import HfApi
          api = HfApi(token=os.environ.get('HF_TOKEN'))
          repo_id = 'Gowthamr23/fast-api-cloud'
          print(f'Polling deployment status for space {repo_id}...')
          time.sleep(15) # Wait for HF build to register
          timeout = 600 # 10 minutes max
          interval = 15
          elapsed = 0
          while elapsed < timeout:
              try:
                  runtime = api.get_space_runtime(repo_id=repo_id)
                  stage = str(runtime.stage).upper()
                  print(f'[{elapsed}s] Space stage: {stage}')
                  if stage == 'RUNNING':
                      print('Deployment successful! Space is RUNNING.')
                      sys.exit(0)
                  elif any(err in stage for err in ['ERROR', 'CRASHED', 'PAUSED', 'STOPPED']):
                      print(f'Deployment failed! Space is in error/inactive state: {stage}')
                      sys.exit(1)
              except Exception as e:
                  print(f'Error querying status: {e}')
              time.sleep(interval)
              elapsed += interval
          print('Deployment polling timed out.')
          sys.exit(1)
          "

